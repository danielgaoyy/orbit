[workspace]
resolver = "2"
members = [
    "crates/orbit-protocol",
    "crates/orbit-crypto",
    "crates/orbit-store",
    "crates/orbit-shim",
    "crates/orbit-providers",
    "crates/orbit-daemon",
    "crates/orbit-relay",
    "crates/orbit-relay-transport",
    "crates/orbit-client-core",
    "crates/orbit-client-wasm",
    "crates/orbit-ffi-uniffi",
    "crates/orbit-uniffi-bindgen",
    "crates/orbit-ffi-ohos",
    "crates/orbit-cli",
]
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.11.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
orbit-protocol = { path = "crates/orbit-protocol" }
orbit-crypto = { path = "crates/orbit-crypto" }
orbit-store = { path = "crates/orbit-store" }
orbit-shim = { path = "crates/orbit-shim" }
orbit-providers = { path = "crates/orbit-providers" }
orbit-daemon = { path = "crates/orbit-daemon" }
orbit-relay = { path = "crates/orbit-relay" }
orbit-relay-transport = { path = "crates/orbit-relay-transport" }
orbit-client-core = { path = "crates/orbit-client-core" }

# Async & Networking
tokio = { version = "1.44", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }

# Serialization & Compression
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
base64 = "0.22"

# Cryptography (Noise NK E2EE & Zero-Knowledge Cloud Vault)
snow = "0.9"
sha2 = "0.10"
ed25519-dalek = "3.0"
aes-gcm = "0.10"
argon2 = "0.6"
rand = "0.9"
zeroize = "1"

# Storage (SQLite WAL)
rusqlite = { version = "0.34", features = ["bundled"] }

# Client Rendering Pipeline (Pure Rust Markdown, Highlighting, Diff, Diagrams, VT100 Grid)
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
similar = "3.2"
vt100 = "0.18"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
layout-rs = { version = "0.1.3", default-features = false }

# Cross-Language Native Bindings (iOS/Android UniFFI & HarmonyOS 7+ N-API)
uniffi = "0.32"
napi-ohos = { version = "1.2", default-features = false, features = ["napi8", "async"] }
napi-derive-ohos = "1.2"
napi-build-ohos = "1.1"

# CLI, PTY & System
clap = { version = "4.5", features = ["derive", "env"] }
notify = "8"
portable-pty = "0.9"
uuid = { version = "1.15", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Observability & Error Handling
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
