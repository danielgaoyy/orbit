name: Build Orbit (Multi-Host Binaries + Android APK + iOS IPA)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  rust-quality-and-e2e:
    name: Rust Clippy & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build-host-binaries:
    name: Build Single Binary (Linux x64/ARM64 & macOS Apple Silicon)
    needs: rust-quality-and-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: orbit-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: orbit-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: orbit-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release static-linked single binary
        run: |
          cargo build --release -p orbit-cli --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/orbit ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-android-apk:
    name: Build Android APK (ARM64 + Rust Native FFI)
    needs: rust-quality-and-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk & build liborbit_ffi.so
        run: |
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a -o app/android/app/src/main/jniLibs build --release -p orbit-ffi
      - name: Build Release Android APK
        working-directory: app
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/gcs-maven-mirror.init.gradle
          beforeSettings { settings ->
              settings.buildscript.repositories {
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
              }
              settings.pluginManagement.repositories {
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
              }
          }
          allprojects {
              buildscript {
                  repositories {
                      maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  }
              }
              repositories {
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
              }
          }
          EOF
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-android-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  build-ios-ipa:
    name: Build iOS App (.ipa for TestFlight / AltStore / SideStore)
    needs: rust-quality-and-e2e
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Build liborbit_ffi.a for iOS ARM64
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        run: |
          cargo build --release -p orbit-ffi --target aarch64-apple-ios
          mkdir -p app/ios/RustFrameworks
          cp target/aarch64-apple-ios/release/liborbit_ffi.a app/ios/RustFrameworks/
      - name: Build Unsigned iOS IPA & Verify FFI Symbols
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep orbit_ffi_noise_client_init
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Orbit-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-ios-ipa
          path: app/Orbit-iOS-unsigned.ipa
