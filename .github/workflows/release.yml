name: Build & Release Orbit (CLI + Tauri Desktop + Native iOS/Android/HarmonyOS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ORBIT_GITHUB_CLIENT_ID: ${{ vars.ORBIT_GITHUB_CLIENT_ID }}
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  rust-quality-and-unit:
    name: Rust Format, Clippy & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "orbit-rust-unit"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins

  e2e-regression-matrix:
    name: E2E (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: pitfall-regressions
            label: "Pitfall Regressions"
            args: "-p orbit-cli --test e2e_pitfall_regressions"
          - suite: relay-security-isolation
            label: "Relay E2EE & Isolation"
            args: "-p orbit-cli --test e2e_relay_and_pty --test e2e_multi_user_isolation"
          - suite: orchestration
            label: "Orchestration & Fleet Mesh"
            args: "-p orbit-cli --test e2e_orchestration"
          - suite: workspace-sync-worktree
            label: "Workspace Sync & Worktree"
            args: "-p orbit-cli --test e2e_workspace_sync_and_worktree"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "orbit-rust-e2e"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run ${{ matrix.label }}
        shell: bash
        run: |
          start_ts=$(date +%s)
          TMPDIR=/tmp cargo test ${{ matrix.args }} -- --test-threads=4
          end_ts=$(date +%s)
          elapsed=$((end_ts - start_ts))
          echo "E2E shard '${{ matrix.label }}' finished in ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  desktop-frontend-quality:
    name: Desktop Frontend Tests, Build & Runtime Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install, test, build & runtime smoke check Desktop frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run build
          npm run test:smoke

  build-host-binaries:
    name: Build CLI & Daemon (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: orbit-cli-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: orbit-cli-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools on Linux for zero-glibc static binaries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release static-linked single binary
        shell: bash
        run: |
          cargo build --release -p orbit-cli --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/orbit ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-macos-cli:
    name: Build macOS CLI & Daemon (orbit-cli-macos-arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build release macOS ARM64 CLI & Daemon binary
        run: |
          cargo build --release -p orbit-cli --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/orbit orbit-cli-macos-arm64
          chmod +x orbit-cli-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-cli-macos-arm64
          path: orbit-cli-macos-arm64

  build-macos-desktop-bin:
    name: Build macOS Tauri v2 Binary (orbit-desktop)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build macOS Tauri v2 binary (--no-bundle)
        working-directory: apps/desktop
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          npm ci
          npx tauri build --no-bundle --target aarch64-apple-darwin
          cp src-tauri/target/aarch64-apple-darwin/release/orbit-desktop _internal-orbit-desktop-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: _internal-orbit-desktop-macos-arm64
          path: apps/desktop/_internal-orbit-desktop-macos-arm64

  build-macos-desktop:
    name: Bundle & Sign macOS Tauri v2 Desktop App (Orbit.dmg)
    needs:
      - build-macos-cli
      - build-macos-desktop-bin
    runs-on: macos-latest
    outputs:
      notarized: ${{ steps.macos-signing.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: orbit-cli-macos-arm64
          path: apps/desktop/src-tauri/binaries
      - uses: actions/download-artifact@v4
        with:
          name: _internal-orbit-desktop-macos-arm64
          path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release
      - name: Prepare macOS Signing & Notarization
        id: macos-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY || secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
              echo "::error::APPLE_CERTIFICATE is set, but APPLE_CERTIFICATE_PASSWORD is missing."
              exit 1
            fi
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            if [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER_ID" ] && [ -n "$API_PRIVATE_KEY" ]; then
              umask 077
              KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
              printf '%s\n' "$API_PRIVATE_KEY" > "$KEY_PATH"
              chmod 600 "$KEY_PATH"
              echo "notarize=api-key" >> "$GITHUB_OUTPUT"
              echo "notarized=true" >> "$GITHUB_OUTPUT"
              echo "api_key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"
            elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "notarize=apple-id" >> "$GITHUB_OUTPUT"
              echo "notarized=true" >> "$GITHUB_OUTPUT"
              echo "api_key_path=" >> "$GITHUB_OUTPUT"
            else
              echo "notarize=none" >> "$GITHUB_OUTPUT"
              echo "notarized=false" >> "$GITHUB_OUTPUT"
              echo "api_key_path=" >> "$GITHUB_OUTPUT"
              echo "::warning::APPLE_CERTIFICATE is configured without Apple notarization secrets; macOS Gatekeeper will still block browser-downloaded builds until notarization secrets are added (see deploy/MACOS_SIGNING.md)."
            fi
          else
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "notarize=none" >> "$GITHUB_OUTPUT"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "api_key_path=" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLE_CERTIFICATE secret is not configured; building an ad-hoc signed macOS bundle. Configure Developer ID + notarization secrets (see deploy/MACOS_SIGNING.md) for zero-warning public releases."
          fi
      - name: Bundle & Sign Tauri v2 macOS App & DMG
        working-directory: apps/desktop
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY_OVERRIDE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY || secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_MODE: ${{ steps.macos-signing.outputs.mode }}
          NOTARIZE_MODE: ${{ steps.macos-signing.outputs.notarize }}
          API_KEY_PATH: ${{ steps.macos-signing.outputs.api_key_path }}
        run: |
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID

          TAURI_EXTRA_ARGS=(--config '{"bundle":{"externalBin":["binaries/orbit"]}}')
          if [ "$SIGNING_MODE" = "developer-id" ]; then
            export APPLE_CERTIFICATE="$CERT_B64"
            export APPLE_CERTIFICATE_PASSWORD="$CERT_PASSWORD"
            if [ -n "$SIGNING_IDENTITY_OVERRIDE" ]; then
              export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY_OVERRIDE"
            fi
            if [ "$NOTARIZE_MODE" = "api-key" ]; then
              export APPLE_API_KEY="$API_KEY_ID"
              export APPLE_API_ISSUER="$API_ISSUER_ID"
              export APPLE_API_KEY_PATH="$API_KEY_PATH"
            elif [ "$NOTARIZE_MODE" = "apple-id" ]; then
              export APPLE_ID="$NOTARY_APPLE_ID"
              export APPLE_PASSWORD="$NOTARY_APPLE_PASSWORD"
              export APPLE_TEAM_ID="$NOTARY_APPLE_TEAM_ID"
            fi
          else
            export APPLE_SIGNING_IDENTITY="-"
            TAURI_EXTRA_ARGS=(--config '{"bundle":{"externalBin":["binaries/orbit"],"macOS":{"hardenedRuntime":false}}}')
          fi

          mv src-tauri/binaries/orbit-cli-macos-arm64 src-tauri/binaries/orbit-aarch64-apple-darwin
          chmod +x src-tauri/binaries/orbit-aarch64-apple-darwin
          mv src-tauri/target/aarch64-apple-darwin/release/_internal-orbit-desktop-macos-arm64 src-tauri/target/aarch64-apple-darwin/release/orbit-desktop
          chmod +x src-tauri/target/aarch64-apple-darwin/release/orbit-desktop

          mkdir -p dist
          npm ci
          npx tauri bundle --target aarch64-apple-darwin --bundles app,dmg "${TAURI_EXTRA_ARGS[@]}"
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg Orbit-macOS-AppleSilicon.dmg
      - name: Verify Signature & Notarize macOS DMG
        working-directory: apps/desktop
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY || secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_MODE: ${{ steps.macos-signing.outputs.mode }}
          NOTARIZE_MODE: ${{ steps.macos-signing.outputs.notarize }}
          API_KEY_PATH: ${{ steps.macos-signing.outputs.api_key_path }}
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Orbit.app"
          DMG_PATH="Orbit-macOS-AppleSilicon.dmg"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"

          if [ "$SIGNING_MODE" = "developer-id" ] && [ "$NOTARIZE_MODE" != "none" ]; then
            spctl --assess --type execute --verbose=4 "$APP_PATH"
            xcrun stapler validate -v "$APP_PATH"

            if [ "$NOTARIZE_MODE" = "api-key" ]; then
              xcrun notarytool submit "$DMG_PATH" \
                --key "$API_KEY_PATH" \
                --key-id "$API_KEY_ID" \
                --issuer "$API_ISSUER_ID" \
                --wait
            elif [ "$NOTARIZE_MODE" = "apple-id" ]; then
              xcrun notarytool submit "$DMG_PATH" \
                --apple-id "$NOTARY_APPLE_ID" \
                --password "$NOTARY_APPLE_PASSWORD" \
                --team-id "$NOTARY_APPLE_TEAM_ID" \
                --wait
            fi

            xcrun stapler staple -v "$DMG_PATH"
            xcrun stapler validate -v "$DMG_PATH"
          fi
      - name: Cleanup Temporary Signing Key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-macOS-AppleSilicon.dmg
          path: apps/desktop/Orbit-macOS-AppleSilicon.dmg

  build-linux-desktop-bin:
    name: Build Linux Tauri v2 Binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri v2 Linux WebKit2GTK 4.1 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Tauri v2 Linux binary (--no-bundle)
        working-directory: apps/desktop
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          npm ci
          npx tauri build --no-bundle --target ${{ matrix.target }}
          cp src-tauri/target/${{ matrix.target }}/release/orbit-desktop _internal-orbit-desktop-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: _internal-orbit-desktop-linux-${{ matrix.arch }}
          path: apps/desktop/_internal-orbit-desktop-linux-${{ matrix.arch }}

  build-linux-desktop:
    name: Bundle Linux Tauri v2 Desktop App (${{ matrix.artifact }})
    needs:
      - build-host-binaries
      - build-linux-desktop-bin
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: x86_64-unknown-linux-gnu
            artifact: Orbit-Linux-x64.deb
            cli_artifact: orbit-cli-linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            artifact: Orbit-Linux-arm64.deb
            cli_artifact: orbit-cli-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri v2 Linux runtime libraries for .deb dependency resolution
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cli_artifact }}
          path: apps/desktop/src-tauri/binaries
      - uses: actions/download-artifact@v4
        with:
          name: _internal-orbit-desktop-linux-${{ matrix.arch }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release
      - name: Bundle Tauri v2 Linux .deb Package
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          mv "src-tauri/binaries/${{ matrix.cli_artifact }}" "src-tauri/binaries/orbit-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/orbit-${{ matrix.target }}"
          mv "src-tauri/target/${{ matrix.target }}/release/_internal-orbit-desktop-linux-${{ matrix.arch }}" "src-tauri/target/${{ matrix.target }}/release/orbit-desktop"
          chmod +x "src-tauri/target/${{ matrix.target }}/release/orbit-desktop"
          mkdir -p dist
          npm ci
          npx tauri bundle --target ${{ matrix.target }} --bundles deb --config '{"bundle":{"externalBin":["binaries/orbit"]}}'
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb "../${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/${{ matrix.artifact }}

  build-windows-cli:
    name: Build Windows CLI & Daemon (orbit-windows-x86_64.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release Windows CLI & Daemon binary
        shell: bash
        run: |
          cargo build --release -p orbit-cli --target x86_64-pc-windows-msvc
          cp target/x86_64-pc-windows-msvc/release/orbit.exe orbit-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-windows-x86_64.exe
          path: orbit-windows-x86_64.exe

  build-windows-desktop-bin:
    name: Build Windows Tauri v2 Binary (orbit-desktop.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows Tauri v2 binary (--no-bundle)
        working-directory: apps/desktop
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          npm ci
          npx tauri build --no-bundle --target x86_64-pc-windows-msvc
          cp src-tauri/target/x86_64-pc-windows-msvc/release/orbit-desktop.exe _internal-orbit-desktop-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: _internal-orbit-desktop-windows-x64
          path: apps/desktop/_internal-orbit-desktop-windows-x64.exe

  build-windows-desktop:
    name: Bundle Windows Tauri v2 Desktop App (.msi & NSIS .exe)
    needs:
      - build-windows-cli
      - build-windows-desktop-bin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/download-artifact@v4
        with:
          name: orbit-windows-x86_64.exe
          path: apps/desktop/src-tauri/binaries
      - uses: actions/download-artifact@v4
        with:
          name: _internal-orbit-desktop-windows-x64
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release
      - name: Bundle Tauri v2 Windows .msi & NSIS .exe Packages
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          mv src-tauri/binaries/orbit-windows-x86_64.exe src-tauri/binaries/orbit-x86_64-pc-windows-msvc.exe
          mv src-tauri/target/x86_64-pc-windows-msvc/release/_internal-orbit-desktop-windows-x64.exe src-tauri/target/x86_64-pc-windows-msvc/release/orbit-desktop.exe
          mkdir -p dist
          npm ci
          npx tauri bundle --target x86_64-pc-windows-msvc --bundles msi,nsis --config '{"bundle":{"externalBin":["binaries/orbit"]}}'
          MSI_FILE="$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi -maxdepth 2 -type f -name '*.msi' | head -n 1)"
          NSIS_FILE="$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -maxdepth 2 -type f -name '*.exe' | head -n 1)"
          if [ -z "$MSI_FILE" ] || [ -z "$NSIS_FILE" ]; then
            echo "::error::Failed to locate built Windows MSI/NSIS installers"
            exit 1
          fi
          cp "$MSI_FILE" Orbit-Windows-x64.msi
          cp "$NSIS_FILE" Orbit-Windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-x64.msi
          path: apps/desktop/Orbit-Windows-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-x64-setup.exe
          path: apps/desktop/Orbit-Windows-x64-setup.exe

  build-android-apk:
    name: Build Native Android APK (Jetpack Compose + UniFFI, minSdk 29)
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.android-signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "orbit-rust-android"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Rust UniFFI JNI Libraries (API 29+)
        run: ./apps/android/scripts/build-rust-android.sh --arm64-only
      - name: Probe Android Release Signing Secrets
        id: android-signing
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PWD: ${{ secrets.ORBIT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORBIT_ANDROID_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.ORBIT_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PWD" ] && \
             [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PWD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android release signing secrets are not configured; building an unsigned APK (Orbit-Android-unsigned.apk)."
          fi
      - name: Assemble Release APK (Jetpack Compose Material 3)
        working-directory: apps/android
        env:
          SHOULD_SIGN: ${{ steps.android-signing.outputs.signed }}
          ORBIT_ANDROID_KEYSTORE_B64: ${{ secrets.ORBIT_ANDROID_KEYSTORE_B64 }}
          ORBIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_ANDROID_KEYSTORE_PASSWORD }}
          ORBIT_ANDROID_KEY_ALIAS: ${{ secrets.ORBIT_ANDROID_KEY_ALIAS }}
          ORBIT_ANDROID_KEY_PASSWORD: ${{ secrets.ORBIT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$SHOULD_SIGN" = "true" ]; then
            SIGN_DIR="$RUNNER_TEMP/android-sign"
            mkdir -p "$SIGN_DIR"
            chmod 700 "$SIGN_DIR"
            umask 077
            printf '%s' "$ORBIT_ANDROID_KEYSTORE_B64" | base64 -d > "$SIGN_DIR/release.jks"
            export ORBIT_ANDROID_KEYSTORE_PATH="$SIGN_DIR/release.jks"
            gradle assembleRelease --no-daemon -PorbitAndroidAbis=arm64-v8a
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
            if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
              echo "::error::Failed to locate apksigner in Android build-tools"
              exit 1
            fi
            "$APKSIGNER" verify --verbose "$APK_PATH"
            cp "$APK_PATH" Orbit-Android-arm64.apk
          else
            gradle assembleRelease --no-daemon -PorbitAndroidAbis=arm64-v8a
            cp app/build/outputs/apk/release/app-release-unsigned.apk Orbit-Android-unsigned.apk
          fi
      - name: Cleanup Temporary Android Signing Materials
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-sign"
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Android-apk
          path: apps/android/Orbit-Android-*.apk

  build-ios-ipa:
    name: Build Native iOS App (SwiftUI iOS 16.4+ + UniFFI XCFramework)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "orbit-rust-ios"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build OrbitCoreFFI.xcframework & Generate Xcode Project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./apps/ios/scripts/build-rust-xcframework.sh --device-only
          cd apps/ios && xcodegen generate
      - name: Build Unsigned Native iOS IPA
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project OrbitMobile.xcodeproj \
            -scheme OrbitMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/OrbitMobile.app Payload/
          zip -r -9 Orbit-iOS-sideload.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-iOS-sideload.ipa
          path: apps/ios/Orbit-iOS-sideload.ipa

  build-harmony-hap:
    name: Build Native HarmonyOS HAP (ArkUI V2 + N-API, API 26)
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.harmony-signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - name: Install HarmonyOS Headless Graphics Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libgles2 libglx0 libglib2.0-0 \
            libx11-6 libxext6 libxrender1 libxrandr2 libxfixes3 libxi6 libxcursor1 \
            libxcomposite1 libxdamage1 libxtst6 libxkbcommon0 \
            libgbm1 libdrm2 fontconfig fonts-dejavu-core jq
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup HarmonyOS Command Line Tools (API 26)
        uses: ErBWs/setup-ohos@v2
        with:
          version: "26.0.0.821"
          cache: false
      - name: Configure HarmonyOS SDK & Package Registries
        run: |
          echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$HOS_SDK_HOME/default/openharmony" >> "$GITHUB_ENV"
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> "$HOME/.npmrc"
          ohpm config set registry https://repo.harmonyos.com/ohpm/
          hvigorw --version || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos,x86_64-unknown-linux-ohos
      - name: Build Rust N-API Libraries (arm64-v8a + x86_64)
        run: ./apps/harmony/scripts/build-rust-ohos.sh
      - name: Probe HarmonyOS Signing Secrets
        id: harmony-signing
        env:
          SIGN_CERT: ${{ secrets.HARMONY_SIGNING_CERT }}
          SIGN_PROFILE: ${{ secrets.HARMONY_SIGNING_PROFILE }}
          SIGN_KEYSTORE: ${{ secrets.HARMONY_SIGNING_KEYSTORE }}
          SIGN_ALIAS: ${{ secrets.HARMONY_SIGNING_KEY_ALIAS }}
          SIGN_KEY_PWD: ${{ secrets.HARMONY_SIGNING_KEY_PASSWORD }}
          SIGN_STORE_PWD: ${{ secrets.HARMONY_SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "$SIGN_CERT" ] && [ -n "$SIGN_PROFILE" ] && [ -n "$SIGN_KEYSTORE" ] && \
             [ -n "$SIGN_ALIAS" ] && [ -n "$SIGN_KEY_PWD" ] && [ -n "$SIGN_STORE_PWD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HarmonyOS signing secrets are not configured; building an unsigned HAP. Configure HARMONY_SIGNING_* secrets (see deploy/HARMONY_SIGNING.md) for signed releases."
          fi
      - name: Prepare Clean CI Signing Config
        run: python3 apps/harmony/scripts/strip-signing.py apps/harmony/build-profile.json5
      - name: Install ohpm Dependencies & Build Release HAP
        working-directory: apps/harmony
        run: |
          ohpm install --all
          hvigorw assembleHap --mode module -p product=default -p module=entry@default -p buildMode=release --no-daemon --stacktrace
      - name: Package & Optionally Sign Orbit-HarmonyOS.hap
        working-directory: apps/harmony
        env:
          SHOULD_SIGN: ${{ steps.harmony-signing.outputs.signed }}
          SIGN_CERT_B64: ${{ secrets.HARMONY_SIGNING_CERT }}
          SIGN_PROFILE_B64: ${{ secrets.HARMONY_SIGNING_PROFILE }}
          SIGN_KEYSTORE_B64: ${{ secrets.HARMONY_SIGNING_KEYSTORE }}
          SIGN_KEY_ALIAS: ${{ secrets.HARMONY_SIGNING_KEY_ALIAS }}
          SIGN_KEY_PWD: ${{ secrets.HARMONY_SIGNING_KEY_PASSWORD }}
          SIGN_STORE_PWD: ${{ secrets.HARMONY_SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED_HAP="$(find entry/build -type f -name '*-unsigned.hap' -path '*/outputs/*' | head -n 1 || true)"
          if [ -z "$UNSIGNED_HAP" ]; then
            UNSIGNED_HAP="$(find entry/build -type f -name '*.hap' -path '*/outputs/*' | head -n 1 || true)"
          fi
          if [ -z "$UNSIGNED_HAP" ] || [ ! -f "$UNSIGNED_HAP" ]; then
            echo "::error::Failed to locate built HAP under apps/harmony/entry/build/"
            find entry/build -maxdepth 5 -type f || true
            exit 1
          fi
          echo "Found assembled HAP: $UNSIGNED_HAP ($(wc -c < "$UNSIGNED_HAP") bytes)"

          if [ "$SHOULD_SIGN" = "true" ]; then
            SIGN_DIR="$RUNNER_TEMP/harmony-sign"
            mkdir -p "$SIGN_DIR"
            chmod 700 "$SIGN_DIR"
            umask 077
            printf '%s' "$SIGN_CERT_B64" | base64 -d > "$SIGN_DIR/app.cer"
            printf '%s' "$SIGN_PROFILE_B64" | base64 -d > "$SIGN_DIR/app.p7b"
            printf '%s' "$SIGN_KEYSTORE_B64" | base64 -d > "$SIGN_DIR/app.p12"

            SIGN_TOOL="$HOS_SDK_HOME/default/openharmony/toolchains/lib/hap-sign-tool.jar"
            java -jar "$SIGN_TOOL" sign-app \
              -mode localSign \
              -signAlg SHA256withECDSA \
              -keyAlias "$SIGN_KEY_ALIAS" \
              -inFile "$UNSIGNED_HAP" \
              -outFile "Orbit-HarmonyOS.hap" \
              -keystoreFile "$SIGN_DIR/app.p12" \
              -keystorePwd "$SIGN_STORE_PWD" \
              -keyPwd "$SIGN_KEY_PWD" \
              -appCertFile "$SIGN_DIR/app.cer" \
              -profileFile "$SIGN_DIR/app.p7b" \
              -signCode 1
          else
            cp -f "$UNSIGNED_HAP" "Orbit-HarmonyOS.hap"
          fi
      - name: Cleanup Temporary HarmonyOS Signing Materials
        if: always()
        run: rm -rf "$RUNNER_TEMP/harmony-sign"
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-HarmonyOS.hap
          path: apps/harmony/Orbit-HarmonyOS.hap

  publish-github-release:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - rust-quality-and-unit
      - e2e-regression-matrix
      - desktop-frontend-quality
      - build-host-binaries
      - build-macos-cli
      - build-macos-desktop
      - build-linux-desktop
      - build-windows-cli
      - build-windows-desktop
      - build-android-apk
      - build-ios-ipa
      - build-harmony-hap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built release assets
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Compute SHA-256 Checksums
        working-directory: release-dist
        run: |
          rm -f _internal-*
          ls -la
          chmod +x orbit-cli-*
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Prepare Release Notes
        id: release-notes
        env:
          NOTARIZED: ${{ needs.build-macos-desktop.outputs.notarized }}
          ANDROID_SIGNED: ${{ needs.build-android-apk.outputs.signed }}
          HARMONY_SIGNED: ${{ needs.build-harmony-hap.outputs.signed }}
        run: |
          {
            echo "body<<ORBIT_RELEASE_BODY_EOF"
            if [ "$NOTARIZED" != "true" ]; then
              cat <<'NOTE'
          > **macOS First Launch Note**: This build is ad-hoc signed without Apple Notarization. On first launch, go to **System Settings → Privacy & Security** and click **Open Anyway**. On macOS Sequoia (15+) or newer, if the *Open Anyway* button does not appear, run:
          > ```bash
          > xattr -dr com.apple.quarantine /Applications/Orbit.app
          > ```

          NOTE
            fi
            if [ "$ANDROID_SIGNED" != "true" ]; then
              cat <<'ANOTE'
          > **Android Sideload Note**: `Orbit-Android-unsigned.apk` is unsigned because Android release signing secrets (`ORBIT_ANDROID_KEYSTORE_*`) are not configured. Sign it with your release keystore via `apksigner` before installing on a device.

          ANOTE
            fi
            if [ "$HARMONY_SIGNED" != "true" ]; then
              cat <<'HNOTE'
          > **HarmonyOS Sideload Note**: `Orbit-HarmonyOS.hap` is unsigned because HarmonyOS release signing secrets are not configured. Sign it with your DevEco Studio / AppGallery Connect certificate (see [`deploy/HARMONY_SIGNING.md`](deploy/HARMONY_SIGNING.md)) or build directly via DevEco Studio before installing via `hdc install`.
          HNOTE
            fi
            echo "ORBIT_RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ steps.release-notes.outputs.body }}
          files: |
            release-dist/Orbit-macOS-AppleSilicon.dmg
            release-dist/Orbit-Linux-arm64.deb
            release-dist/Orbit-Linux-x64.deb
            release-dist/Orbit-Windows-x64.msi
            release-dist/Orbit-Windows-x64-setup.exe
            release-dist/orbit-cli-macos-arm64
            release-dist/orbit-cli-linux-arm64
            release-dist/orbit-cli-linux-x64
            release-dist/orbit-windows-x86_64.exe
            release-dist/Orbit-Android-*.apk
            release-dist/Orbit-iOS-sideload.ipa
            release-dist/Orbit-HarmonyOS.hap
            release-dist/SHA256SUMS.txt
