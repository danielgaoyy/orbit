name: Publish Native iOS App to Apple TestFlight

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Your Apple App Store Connect Bundle ID (e.g. dev.orbit.app)"
        required: true
        default: "dev.orbit.app"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  upload-to-testflight:
    name: Cloud-Sign & Upload Native SwiftUI IPA to TestFlight
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      TARGET_BUNDLE_ID: ${{ inputs.bundle_id || vars.IOS_BUNDLE_ID || 'dev.orbit.app' }}
    steps:
      - name: Check TestFlight Credentials
        id: creds
        run: |
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ] || [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Missing Apple TestFlight secrets! Follow deploy/TESTFLIGHT.md."
              exit 1
            else
              echo "::notice::TestFlight secrets not configured yet; skipping automatic TestFlight upload."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.creds.outputs.ready == 'true'
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build Rust UniFFI XCFramework & Generate Xcode Project
        if: steps.creds.outputs.ready == 'true'
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./apps/ios/scripts/build-rust-xcframework.sh
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: .*/PRODUCT_BUNDLE_IDENTIFIER: ${TARGET_BUNDLE_ID}/g" apps/ios/project.yml
          cd apps/ios && xcodegen generate

      - name: Provision Apple Signing & Upload Archive to TestFlight
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/ios
        run: |
          pip3 install codemagic-cli-tools
          keychain initialize
          app-store-connect fetch-signing-files "$TARGET_BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project OrbitMobile.xcodeproj
          xcode-project build-ipa --project OrbitMobile.xcodeproj --scheme OrbitMobile
          app-store-connect publish --path "$(ls build/ios/ipa/*.ipa | head -n 1)"
