[package]
name = "orbit-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tracing-subscriber.workspace = true
tempfile = "3"
json5 = "1"
orbit-protocol.workspace = true
orbit-crypto.workspace = true
orbit-relay-transport.workspace = true
orbit-store.workspace = true
orbit-providers.workspace = true
orbit-shim.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
zeroize.workspace = true
vt100.workspace = true
reqwest = { workspace = true, features = ["multipart", "http2"] }
pulldown-cmark.workspace = true
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
notify.workspace = true
cap-std = "4.0"
cap-fs-ext = "4.0"
serde-saphyr = { version = "2.2", default-features = false, features = ["serialize", "deserialize"] }
wasmi = { version = "2.0.2", default-features = false, features = ["std", "validate", "portable-dispatch", "extra-checks"] }
globset = "0.4"
regex = "1"
rustc_lexer = "0.1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
wat = "1"

[[example]]
name = "build_plugins"
test = true
path = "../../examples/plugins/build.rs"
