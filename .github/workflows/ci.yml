name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ORBIT_GITHUB_CLIENT_ID: ${{ vars.ORBIT_GITHUB_CLIENT_ID }}

jobs:
  rust-quality-and-unit:
    name: Rust Format, Clippy & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer shell syntax checks
        run: |
          bash -n deploy/install.sh deploy/install-desktop-linux.sh
          sh -n deploy/install.sh deploy/install-desktop-linux.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust formatting checks (workspace & Tauri desktop crate)
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins

  e2e-regression-matrix:
    name: E2E (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: pitfall-regressions
            label: "Pitfall Regressions"
            args: "-p orbit-cli --test e2e_pitfall_regressions"
          - suite: relay-security-isolation
            label: "Relay E2EE & Isolation"
            args: "-p orbit-cli --test e2e_relay_and_pty --test e2e_multi_user_isolation"
          - suite: orchestration
            label: "Orchestration & Fleet Mesh"
            args: "-p orbit-cli --test e2e_orchestration"
          - suite: workspace-sync-worktree
            label: "Workspace Sync & Worktree"
            args: "-p orbit-cli --test e2e_workspace_sync_and_worktree"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "orbit-rust-e2e"
      - name: Run ${{ matrix.label }}
        shell: bash
        run: |
          start_ts=$(date +%s)
          TMPDIR=/tmp cargo test ${{ matrix.args }} -- --test-threads=4
          end_ts=$(date +%s)
          elapsed=$((end_ts - start_ts))
          echo "E2E shard '${{ matrix.label }}' finished in ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  tauri-rust-check:
    name: Tauri Desktop Rust Clippy & Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Format, Clippy & Test Tauri Desktop Rust crate
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          mkdir -p apps/desktop/dist
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows-rust-and-desktop-check:
    name: Windows Rust Check, Tests & Tauri Desktop Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Cargo check & tests on Windows
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cargo check --workspace --all-targets
          cargo build -p orbit-cli --bin orbit
          cargo test --workspace -- --skip live_devbox_ssh_one_click_e2e
      - name: Build Desktop frontend & check Tauri Windows crate
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop test
          npm --prefix apps/desktop run build
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  desktop-frontend-build:
    name: Desktop Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install, test, build & runtime smoke check Desktop frontend
        working-directory: apps/desktop
        run: |
          npm ci
          node --experimental-strip-types --test "src/**/*.test.ts"
          npm run build
          npm run test:smoke

  ios-build-and-simulator-smoke:
    name: Native iOS Build & Simulator Launch Smoke Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build OrbitCoreFFI.xcframework & Generate Xcode Project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./apps/ios/scripts/build-rust-xcframework.sh
          cd apps/ios && xcodegen generate
      - name: Build iOS Device Target (Release, Unsigned)
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project OrbitMobile.xcodeproj \
            -scheme OrbitMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ReleaseDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build & Launch on iOS Simulator with Live Orbit Daemon
        run: |
          set -euo pipefail
          cargo build -p orbit-cli
          ./target/debug/orbit daemon >/tmp/orbit-daemon.log 2>&1 &
          DAEMON_PID=$!
          trap 'kill $DAEMON_PID 2>/dev/null || true' EXIT
          sleep 2

          SIM_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data.get("devices", {}).items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')"
          echo "Selected Simulator UDID: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          xcodebuild \
            -project apps/ios/OrbitMobile.xcodeproj \
            -scheme OrbitMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath apps/ios/build/SimDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project apps/ios/OrbitMobile.xcodeproj \
            -scheme OrbitMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath apps/ios/build/SimDerivedData \
            -only-testing:OrbitMobileLogicTests \
            CODE_SIGNING_ALLOWED=NO \
            test

          APP_PATH="apps/ios/build/SimDerivedData/Build/Products/Debug-iphonesimulator/OrbitMobile.app"
          BUNDLE_ID="dev.orbit.app"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          mkdir -p /tmp/ios-sim-screenshots

          PAIR_URI="$(./target/debug/orbit pair 2>/dev/null | grep -oE 'orbit://pair/[^[:space:]]+' | head -n 1 || true)"
          echo "Local daemon pair URI detected: ${PAIR_URI:+yes}"

          for mode in stage drawer settings automations sidequestion files; do
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            if [ -n "$PAIR_URI" ]; then
              if [ "$mode" = "stage" ]; then
                xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -orbitTheme dark -orbitPairUri "$PAIR_URI"
              else
                xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -orbitTheme dark -orbitPairUri "$PAIR_URI" -orbitOpenSheet "$mode"
              fi
            else
              if [ "$mode" = "stage" ]; then
                xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -orbitTheme dark
              else
                xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -orbitTheme dark -orbitOpenSheet "$mode"
              fi
            fi
            sleep 3
            xcrun simctl io "$SIM_UDID" screenshot "/tmp/ios-sim-screenshots/${mode}.png"
          done

          for demo_theme in dark light; do
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -orbitTheme "$demo_theme" -orbitDemoChat
            sleep 3
            xcrun simctl io "$SIM_UDID" screenshot "/tmp/ios-sim-screenshots/demo-chat-${demo_theme}.png"
          done
          ls -la /tmp/ios-sim-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: /tmp/ios-sim-screenshots

  android-build-check:
    name: Native Android UniFFI & Debug APK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build Rust UniFFI JNI Libraries (API 29+)
        run: ./apps/android/scripts/build-rust-android.sh
      - name: Assemble Debug APK
        working-directory: apps/android
        run: gradle assembleDebug --no-daemon
