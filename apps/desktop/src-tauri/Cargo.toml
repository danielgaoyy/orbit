[package]
name = "orbit-desktop"
version = "0.11.3"
description = "Orbit Multi-Host AI Coding Agent Desktop Control Plane (macOS, Windows & Linux)"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
orbit-client-core = { path = "../../../crates/orbit-client-core" }
orbit-crypto = { path = "../../../crates/orbit-crypto" }
orbit-protocol = { path = "../../../crates/orbit-protocol" }
orbit-providers = { path = "../../../crates/orbit-providers" }
tauri = { version = "2.12", features = ["tray-icon"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["fs", "io-util", "process", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.22"
gtk = "0.18"
gdk = "0.18"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "abort"
