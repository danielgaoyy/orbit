name: Build & Release Orbit (CLI + macOS App + Android APK + iOS IPA)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-quality-and-e2e:
    name: Rust Clippy & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build-host-binaries:
    name: Build CLI & Daemon (${{ matrix.artifact }})
    needs: rust-quality-and-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: orbit-cli-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: orbit-cli-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: orbit-cli-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release static-linked single binary
        run: |
          cargo build --release -p orbit-cli --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/orbit ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-macos-desktop:
    name: Build macOS Desktop App (Orbit.dmg)
    needs: rust-quality-and-e2e
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build liborbit_ffi.a for macOS Apple Silicon
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release -p orbit-ffi --target aarch64-apple-darwin
          mkdir -p app/macos/RustFrameworks
          cp target/aarch64-apple-darwin/release/liborbit_ffi.a app/macos/RustFrameworks/
      - name: Build Orbit.app & Package Orbit-macOS-AppleSilicon.dmg
        working-directory: app
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release
          nm -gU build/macos/Build/Products/Release/Orbit.app/Contents/MacOS/Orbit | grep orbit_ffi_noise_client_init
          codesign --force --deep --sign - build/macos/Build/Products/Release/Orbit.app
          mkdir -p dmg-staging
          cp -R build/macos/Build/Products/Release/Orbit.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Orbit" -srcfolder dmg-staging -ov -format UDZO Orbit-macOS-AppleSilicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-macOS-AppleSilicon.dmg
          path: app/Orbit-macOS-AppleSilicon.dmg

  build-linux-desktop:
    name: Build Linux Desktop App (${{ matrix.artifact }})
    needs: rust-quality-and-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flutter_arch: x64
            artifact: Orbit-Linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            flutter_arch: arm64
            artifact: Orbit-Linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3 & Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build liborbit_ffi.so for Linux Desktop
        run: |
          cargo build --release -p orbit-ffi --target ${{ matrix.target }}
          mkdir -p app/linux/RustLibs
          cp target/${{ matrix.target }}/release/liborbit_ffi.so app/linux/RustLibs/
      - name: Setup Flutter SDK & Build Linux Desktop Bundle
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter config --no-analytics --enable-linux-desktop
          cd app
          flutter pub get
          flutter build linux --release
          test -f "build/linux/${{ matrix.flutter_arch }}/release/bundle/lib/liborbit_ffi.so"
          tar -czf "../${{ matrix.artifact }}" -C "build/linux/${{ matrix.flutter_arch }}/release/bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-android-apk:
    name: Build Android APK (ARM64 + Rust Native FFI)
    needs: rust-quality-and-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk & build liborbit_ffi.so
        run: |
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a -o app/android/app/src/main/jniLibs build --release -p orbit-ffi
      - name: Build Release Android APK
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release --target-platform android-arm64 || (sleep 5 && flutter build apk --release --target-platform android-arm64)
          cp build/app/outputs/flutter-apk/app-release.apk Orbit-Android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Android-arm64.apk
          path: app/Orbit-Android-arm64.apk

  build-ios-ipa:
    name: Build iOS App (.ipa for Sideloading)
    needs: rust-quality-and-e2e
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Build liborbit_ffi.a for iOS ARM64
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        run: |
          cargo build --release -p orbit-ffi --target aarch64-apple-ios
          mkdir -p app/ios/RustFrameworks
          cp target/aarch64-apple-ios/release/liborbit_ffi.a app/ios/RustFrameworks/
      - name: Build Unsigned iOS IPA & Verify FFI Symbols
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep orbit_ffi_noise_client_init
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Orbit-iOS-sideload.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-iOS-sideload.ipa
          path: app/Orbit-iOS-sideload.ipa

  publish-github-release:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-host-binaries
      - build-macos-desktop
      - build-linux-desktop
      - build-android-apk
      - build-ios-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built release assets
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Compute SHA-256 Checksums
        working-directory: release-dist
        run: |
          chmod +x orbit-cli-*
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Downloads (即下即用安装包)

            | 平台 / 用途 | 下载文件 | 安装与使用说明 |
            | :--- | :--- | :--- |
            | **macOS 桌面端 App** (Apple Silicon) | `Orbit-macOS-AppleSilicon.dmg` | 双击打开拖入 `Applications`。首次打开未公证包如遇拦截，执行一次：`xattr -cr /Applications/Orbit.app` |
            | **Linux ARM64 桌面端 App** (Ubuntu / GNOME) | `Orbit-Linux-arm64.tar.gz` | 一键安装桌面图标：`curl -fsSL https://raw.githubusercontent.com/danielgaoyy/orbit/main/deploy/install-desktop-linux.sh \| sh` |
            | **Linux x86_64 桌面端 App** (Ubuntu / GNOME) | `Orbit-Linux-x64.tar.gz` | 一键安装桌面图标：`curl -fsSL https://raw.githubusercontent.com/danielgaoyy/orbit/main/deploy/install-desktop-linux.sh \| sh` |
            | **macOS 守护进程 & CLI** (Mac mini) | `orbit-cli-macos-arm64` | `chmod +x orbit-cli-macos-arm64 && sudo mv orbit-cli-macos-arm64 /usr/local/bin/orbit` |
            | **Linux ARM64 守护进程 & Relay** | `orbit-cli-linux-arm64` | `chmod +x orbit-cli-linux-arm64 && mv orbit-cli-linux-arm64 ~/.local/bin/orbit` |
            | **Linux x86_64 守护进程 & Relay** | `orbit-cli-linux-x64` | `chmod +x orbit-cli-linux-x64 && mv orbit-cli-linux-x64 ~/.local/bin/orbit` |
            | **Android 手机客户端** | `Orbit-Android-arm64.apk` | 手机直接点击安装 |
            | **iOS 侧载安装包** (iPhone / iPad) | `Orbit-iOS-sideload.ipa` | 可通过 AltStore / SideStore / Sideloadly 安装，或使用仓库内置 `Publish to TestFlight` 工作流推送至官方 TestFlight |
          files: |
            release-dist/Orbit-macOS-AppleSilicon.dmg
            release-dist/Orbit-Linux-arm64.tar.gz
            release-dist/Orbit-Linux-x64.tar.gz
            release-dist/orbit-cli-macos-arm64
            release-dist/orbit-cli-linux-arm64
            release-dist/orbit-cli-linux-x64
            release-dist/Orbit-Android-arm64.apk
            release-dist/Orbit-iOS-sideload.ipa
            release-dist/SHA256SUMS.txt
