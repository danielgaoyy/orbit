[package]
name = "orbit-desktop"
version = "0.3.5"
description = "Orbit Multi-Host AI Coding Agent Desktop Control Plane (macOS & Linux)"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
orbit-client-core = { path = "../../../crates/orbit-client-core" }
orbit-protocol = { path = "../../../crates/orbit-protocol" }
tauri = { version = "2.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["fs", "io-util", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
