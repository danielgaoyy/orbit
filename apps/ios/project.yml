name: OrbitMobile
options:
  bundleIdPrefix: dev.orbit
  deploymentTarget:
    iOS: "16.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    MARKETING_VERSION: "0.11.5"
    CURRENT_PROJECT_VERSION: "11005"

targets:
  OrbitMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: Sources
      - path: Generated/orbit_ffi_uniffi.swift
      - path: LiveActivity/OrbitAgentActivityAttributes.swift
    dependencies:
      - framework: Frameworks/OrbitCoreFFI.xcframework
        embed: false
      - target: OrbitLiveActivityExtension
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "Scan `orbit pair` QR codes and take photos to attach to your coding agents."
        NSLocalNetworkUsageDescription: "Orbit connects to paired daemons on your local network."
        NSMicrophoneUsageDescription: "Record voice prompts directly in the Orbit composer."
        NSSpeechRecognitionUsageDescription: "Transcribe spoken prompts into the Orbit composer."
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.orbit.app
            CFBundleURLSchemes:
              - orbit
        # Orbit uses Noise_NK_25519_ChaChaPoly_SHA256 E2EE and AES-256-GCM encrypted cloud sync.
        ITSAppUsesNonExemptEncryption: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbit.app
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -lc++"

  OrbitLiveActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: LiveActivity
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Orbit Live Activity
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbit.app.live-activity
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  OrbitMobileLogicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: Sources/Store/OrbitIosLogic.swift
      - path: Sources/Store/OrbitKeychain.swift
      - path: Tests/OrbitIosLogicTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbit.app.logic-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"

schemes:
  OrbitMobile:
    build:
      targets:
        OrbitMobile: all
        OrbitLiveActivityExtension: all
        OrbitMobileLogicTests: [test]
    test:
      config: Debug
      targets:
        - OrbitMobileLogicTests
