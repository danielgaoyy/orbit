name: OrbitMobile
options:
  bundleIdPrefix: dev.orbit
  deploymentTarget:
    iOS: "16.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    MARKETING_VERSION: "0.3.3"
    CURRENT_PROJECT_VERSION: "3003"

targets:
  OrbitMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: Sources
      - path: Generated/orbit_ffi_uniffi.swift
    dependencies:
      - framework: Frameworks/OrbitCoreFFI.xcframework
        embed: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Scan `orbit pair` QR codes and take photos to attach to your coding agents."
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.orbit.app
            CFBundleURLSchemes:
              - orbit
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbit.app
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -lc++"
